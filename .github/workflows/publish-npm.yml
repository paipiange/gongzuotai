name: Publish to npm

# 通过 OIDC trusted publishing 发布 dsh-paipiange + paipiange 双包到 npm。
# 触发：推送 v* 标签。发布前需在 npm 包设置里配置 trusted publisher：
#   dsh-paipiange -> 关联 paipiange/gongzuotai，workflow 文件名 publish-npm.yml，允许 npm publish
#   paipiange     -> 同上
# 参考：https://docs.npmjs.com/generating-provenance-statements
#       https://docs.npmjs.com/trusted-publishers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      package:
        description: '要发布的包（留空则发布双包）'
        required: false
        type: choice
        options:
          - dsh-paipiange
          - paipiange
        default: ''

permissions:
  contents: read
  id-token: write # OIDC trusted publishing 必需

jobs:
  publish:
    name: Publish dsh-paipiange + paipiange
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # 一个包失败不阻断另一个
      matrix:
        package: ${{ fromJSON(github.event_name == 'workflow_dispatch' && github.event.inputs.package != '' && format('["{0}"]', github.event.inputs.package) || '["dsh-paipiange","paipiange"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # trusted publishing 要求 npm CLI >= 11.5.1；Node 24.5.0+ 才捆绑 npm 11（Node 22 是 npm 10 会报误导性 404）
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build plugin
        run: pnpm build:plugin

      # 双包发布：本地 name 是 dsh-paipiange；发 paipiange 时临时改 name。
      - name: Switch package name to ${{ matrix.package }}
        if: matrix.package == 'paipiange'
        run: node scripts/publish-dual.cjs

      - name: Publish ${{ matrix.package }} to npm
        # OIDC trusted publishing：无需 NPM_TOKEN，npm 自动用 GitHub OIDC 换取临时发布凭证。
        # 用 npx npm@11 显式跑 npm 11（Node 22 捆绑的 npm 10 无法做 OIDC 交换，会报误导性 404）。
        run: npx npm@11 publish --provenance --access public --ignore-scripts

      # 还原 name，避免影响后续步骤（虽然每个 matrix 是独立 checkout，但保持干净）。
      - name: Restore package name
        if: matrix.package == 'paipiange'
        run: node scripts/publish-dual.cjs --restore
